<head>

<style>
  :root {
    --red: #E10600;
    --ink: #0B0B0B;
    --gray-700: #5A6060;
    --gray-300: #d9dada;
    --gray-100: #F5F5F5;
    --white: #FFFFFF;
    --green: #0a7d2c;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--gray-100); color: var(--ink); }
  header { background: var(--ink); color: var(--white); padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--red); }

  .tabs { display: flex; gap: 4px; padding: 12px 24px 0; background: var(--white); border-bottom: 1px solid var(--gray-300); flex-wrap: wrap; }
  .tab-btn {
    padding: 10px 18px; border: none; background: transparent; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--gray-700); border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }

  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .ventana { display: none; }
  .ventana.active { display: block; }

  .controles {
    display: flex; gap: 16px; flex-wrap: wrap; align-items: end;
    background: var(--white); padding: 16px; border-radius: 8px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-700); }
  .campo select, .campo input[type="date"] { padding: 8px 10px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; min-width: 200px; }
  .campo select[multiple] { min-width: 300px; height: 110px; }
  .campo button {
    padding: 9px 16px; border: none; border-radius: 6px; background: var(--ink); color: var(--white);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .campo button:hover { opacity: 0.85; }

  .chart-box { background: var(--white); border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); height: 380px; }
  .estado { font-size: 13px; color: var(--gray-700); margin: 8px 0; }
  .error { color: var(--red); }

  .tabla-wrap { overflow-x: auto; background: var(--white); border-radius: 8px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-top: 12px; }
  table.tabla-resumen { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tabla-resumen th, table.tabla-resumen td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--gray-300); white-space: nowrap; }
  table.tabla-resumen th:first-child, table.tabla-resumen td:first-child { text-align: left; }
  table.tabla-resumen th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--gray-700); }
  .pos { color: var(--green); font-weight: 600; }
  .neg { color: var(--red); font-weight: 600; }
  .ventana h3 { font-size: 15px; margin: 0 0 12px; color: var(--ink); border-bottom: 2px solid var(--red); padding-bottom: 6px; }

  /* Tarjetas de tasas (Financiamiento) — pedido de Juan 2026-08-09: las tasas
     vigentes siempre a la vista, en tarjetas; el histórico abajo, en gráfico. */
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 6px; }
  .tarjeta { background: var(--white); border-radius: 8px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 3px solid var(--red); }
  .tarjeta .t-grupo { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gray-700); }
  .tarjeta .t-nombre { font-size: 13px; font-weight: 600; margin: 2px 0 6px; }
  .tarjeta .t-valor { font-size: 26px; font-weight: 700; line-height: 1; }
  .tarjeta .t-valor.sindato { font-size: 15px; font-weight: 500; color: var(--gray-700); }
  .tarjeta .t-pie { font-size: 11px; color: var(--gray-700); margin-top: 6px; }
  .tarjeta.vieja { border-left-color: var(--gray-300); }
  .tarjeta.vieja .t-valor { color: var(--gray-700); }
  .grupo-tarjetas { margin-bottom: 16px; }
  .grupo-tarjetas > h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gray-700); margin: 0 0 8px; }

  /* `.campos` se usaba sin estar definida: los campos de Mora quedaban uno
     abajo del otro en una columna angosta. Es la fila de campos, igual que
     .controles. */
  .campos { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }

  .cert-tabla-wrap { max-height: 420px; overflow: auto; margin-top: 12px;
    background: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .cert-tabla-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cert-tabla-wrap th { position: sticky; top: 0; background: var(--white); z-index: 1;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--gray-700);
    padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--gray-300); }
  .cert-tabla-wrap td { padding: 6px 12px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid rgba(0,0,0,.05); font-variant-numeric: tabular-nums; }
  .cert-tabla-wrap th:first-child, .cert-tabla-wrap td:first-child { text-align: left; }
  /* ⚠ EL TINTE ES DEL REGIMEN Y EL BORDE ES DEL CAMBIO — son dos preguntas
     distintas y antes el amarillo contestaba las dos a medias. El tinte dice
     "bajo que regla se calculo este dia"; el borde grueso dice "aca cambio la
     regla". Con 1.478 filas, el que audita busca el borde; el que lee una
     fila suelta mira el tinte. El color sale del motor (`f.color`), no de una
     tabla repetida aca: si manana entra un cuarto regimen, la pantalla lo
     pinta sola. */
  .cert-tabla-wrap tr[data-reg] td:first-child { border-left: 4px solid var(--c, transparent); }
  .cert-tabla-wrap tr.cambio td { border-top: 2px solid var(--c, #b7791f); font-weight: 600; }
  .cert-tabla-wrap tr.cambio td:first-child::after {
    content: ' ← cambia el régimen'; font-size: 10.5px; font-weight: 600; color: var(--c, #b7791f); }
  .cert-tabla-wrap tr.sinregimen td { background: rgba(200,0,0,.06); color: var(--gray-700); }

  /* Leyenda de regimenes: una linea por tramo, con la barra de su color a la
     izquierda. Es la respuesta a "de donde sale la tasa", y va ARRIBA del
     resultado — se lee antes del numero, no despues de que alguien pregunte. */
  .cert-tramo { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px;
    background: var(--white); border-radius: 6px; margin-bottom: 6px;
    border-left: 5px solid var(--c, var(--gray-300)); font-size: 12.5px; line-height: 1.45; }
  .cert-tramo .t-regla { font-weight: 700; color: var(--c, var(--ink)); }
  .cert-tramo .t-fuente { color: var(--gray-700); font-size: 11.5px; }
  .cert-tramo .t-cifra { margin-left: auto; text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .cert-tramo .t-sinconf { display: inline-block; background: rgba(200,0,0,.10);
    color: #a01010; border-radius: 4px; padding: 1px 6px; font-size: 10.5px; font-weight: 700; }

  /* Las dos lecturas del interes, lado a lado y del mismo tamano (ver el
     comentario de `calcular` en descuento_certificados.py). */
  .cert-lectura { flex: 1; min-width: 270px; border: 2px solid var(--c, var(--gray-300));
    border-radius: 8px; padding: 14px; background: var(--white); }
  .cert-lectura .l-tit { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--c, var(--gray-700)); font-weight: 700; }
  .cert-lectura .l-coef { font-size: 30px; font-weight: 700; margin: 6px 0;
    font-variant-numeric: tabular-nums; }
  .cert-lectura .l-plata { font-size: 19px; font-weight: 700; }
  .cert-lectura .l-pie { font-size: 11.5px; color: var(--gray-700); margin-top: 6px; }
</style>
</head>

<header><h1>Sibratech <span>·</span> Índices en vivo</h1></header>

<div id="estado-sync" style="max-width:1200px;margin:6px auto 0;padding:0 12px;font-size:12px;color:var(--muted,#5A6060)"></div>

<script>
const API = (window.SIBRA_API_INDICES ?? (location.pathname.startsWith('/indices') ? '/indices' : ''));

// De dónde salen los datos. Con api/server.py escuchando contesta Flask; si no
// (GitHub Pages, que es estático) contesta shared/sibra-indices-api.js leyendo
// Supabase con tu usuario. Se decide UNA vez, probando el server — no alcanza
// con mirar la URL: servido desde el 8100 el prefijo también es "" y ahí sí
// hay backend.
let MODO_SB = false;

async function detectarBackend() {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch(`${API}/api/estado-sync`, { signal: ctl.signal });
    clearTimeout(t);
    MODO_SB = !r.ok;
  } catch { MODO_SB = true; }
  return MODO_SB;
}

// Misma firma que fetch() para el resto de la página: devuelve algo con .ok,
// .status y .json().
function pedir(ruta) {
  return MODO_SB ? SbIndices.get(ruta) : fetch(`${API}${ruta}`);
}

// El cartel de error tiene que decir la verdad del modo en el que está: pedir
// que se prenda api/server.py no sirve de nada en la página publicada.
function msgFalla(err) {
  if (!MODO_SB) return `No se pudo conectar con el servidor local (${API}). ¿Está corriendo api/server.py?`;
  return `No se pudieron traer los datos de la base${err?.message ? ` (${err.message})` : ''}.`;
}

const RANGOS = [
  { value: 'todo', label: 'Todo' },
  { value: '5a', label: 'Últimos 5 años' },
  { value: '1a', label: 'Último año' },
  { value: '6m', label: 'Últimos 6 meses' },
  { value: 'ytd', label: 'YTD (desde 1° enero)' },
  { value: 'mtd', label: 'MTD (desde 1° del mes)' },
  { value: '1m', label: 'Último mes' },
];

function filtrarPorRango(puntos, rango) {
  if (!puntos || !puntos.length || !rango || rango === 'todo') return puntos;
  const ultima = new Date(puntos[puntos.length - 1].fecha);
  let desde;
  switch (rango) {
    case '5a': desde = new Date(ultima); desde.setFullYear(desde.getFullYear() - 5); break;
    case '1a': desde = new Date(ultima); desde.setFullYear(desde.getFullYear() - 1); break;
    case '6m': desde = new Date(ultima); desde.setMonth(desde.getMonth() - 6); break;
    case 'ytd': desde = new Date(ultima.getFullYear(), 0, 1); break;
    case 'mtd': desde = new Date(ultima.getFullYear(), ultima.getMonth(), 1); break;
    case '1m': desde = new Date(ultima); desde.setMonth(desde.getMonth() - 1); break;
    default: return puntos;
  }
  return puntos.filter(p => new Date(p.fecha) >= desde);
}

const INDICES_AJUSTE = [

const CONSTRUCCION_SERIES = [

const REM_SERIES = [
  { value: 'ipc', label: 'Inflación mensual (curva del REM, próximos ~7 meses)' },
  { value: 'ipc_anual', label: 'Inflación anual (REM dic/dic, por año)' },
  { value: 'combinada', label: 'Curva mensual combinada (real + REM + repartido)' },

const FUENTE_LABEL = {

  rem_interanual_repartido: 'Repartido (REM interanual)',
};
const FUENTE_COLOR = {

  rem_interanual_repartido: '#B08800',
};
// Un color por TRAMO repartido (cada ancla interanual del REM: hasta dic-26,
// dic-26→jul-27, jul-27→dic-27, …). Se asignan en orden cronológico.
const PALETA_TRAMOS = ['#B08800', '#C2410C', '#9333EA', '#0D9488', '#BE123C', '#4F46E5'];

const VENTANAS = [
  { id: 'resumen', nombre: 'Resumen', esResumen: true },
  { id: 'uocra', nombre: 'UOCRA', familia: 'uocra', nombreSerie: 'UOCRA · Oficial', proyectable: true, esUocra: true },
  { id: 'ripte', nombre: 'RIPTE', familia: 'ripte', nombreSerie: 'RIPTE', proyectable: true },
  { id: 'dolar', nombre: 'Dólar', familia: 'dolar', esDolar: true },
  { id: 'ipc', nombre: 'IPC (INDEC)', familia: 'ipc_nivel', nombreSerie: 'IPC (INDEC) · índice nivel' },
  { id: 'materiales', nombre: 'Materiales', esMateriales: true },
  { id: 'construccion', nombre: 'Construcción (APYMECO/CAMARCO)', familia: 'construccion', proyectable: true, esConstruccion: true },

  { id: 'mora', nombre: 'Mora y descuento', esMora: true },
  // ⚠ Pestaña APARTE de Mora, no una tasa más de su menú: la conversión de

  { id: 'certificados', nombre: 'Descuento de certificados (BNA)', esCertificados: true },

];

// Financiamiento (pedido de Juan, 2026-08-09): qué se puede graficar.
// ⚠ Cheques en dólares NO figura porque NO EXISTE en MAV — la API contesta

function crearSelect(id, opciones, labelKey, valueKey) {
  const opts = opciones.map(o =>
    `<option value="${o[valueKey]}">${o[labelKey]}</option>`
  ).join('');
  return `<select id="${id}">${opts}</select>`;
}

function render() {
  tabsEl.innerHTML = VENTANAS.map((v, i) =>
    `<button class="tab-btn${i === 0 ? ' active' : ''}" data-id="${v.id}">${v.nombre}</button>`
  ).join('');

  ventanasEl.innerHTML = VENTANAS.map((v, i) => {
    if (v.esRedet) {
      return `
        <section class="ventana${i === 0 ? ' active' : ''}" id="ventana-${v.id}">
          <h3>Salto de redeterminación</h3>
          <p class="nota">El índice se pacta en el contrato. La cuenta la hace el
            backend, que aplica <strong>el índice del mes anterior en las dos
            puntas</strong>: base abril → agosto busca marzo → julio.</p>
          <div class="controles">
            <div class="campo"><label>Índice pactado</label><select id="redet-serie"></select></div>
            <div class="campo"><label>Columna</label><select id="redet-columna"></select></div>
            <div class="campo"><label>Mes base del contrato</label><input type="month" id="redet-base"></div>
            <div class="campo"><label>Mes a redeterminar</label><input type="month" id="redet-mes"></div>
            <div class="campo"><label>Monto a ajustar</label><input type="number" id="redet-monto" placeholder="opcional" step="0.01" style="width:140px"></div>
            <div class="campo"><label>&nbsp;</label><button type="button" id="redet-calcular">Calcular</button></div>
          </div>
          <div class="estado" id="estado-${v.id}"></div>
          <div id="redet-resultado"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th>Índice pactable</th><th>Columnas</th><th>Llega hasta</th></tr></thead>
              <tbody id="redet-series-tbody"></tbody>
            </table>
          </div>
          <p class="nota">⚠ Mirá <em>Llega hasta</em> ANTES de firmar: un contrato
            con un índice que dejó de publicarse no se puede redeterminar.</p>
        </section>`;
    }

    if (v.esManoObra) {
      return `
        <section class="ventana${i === 0 ? ' active' : ''}" id="ventana-${v.id}">
          <h3>Las tres bases de hora</h3>
          <p class="nota"><strong>Hora oficial</strong> es el básico publicado.
            <strong>Hora CAMARCO</strong> es ese básico por el coeficiente de
            incidencia de cargas sociales. <strong>Hora recibo</strong> todavía no
            existe: es la liquidación real, para el subcontrato exacto.</p>
          <div class="controles">
            <div class="campo"><label>Mes</label><input type="month" id="mo-mes"></div>
            <div class="campo"><label>&nbsp;</label><button type="button" id="mo-calcular">Calcular</button></div>
          </div>
          <div class="estado" id="estado-${v.id}"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th>Categoría</th><th>Hora oficial</th><th>Hora CAMARCO</th></tr></thead>
              <tbody id="mo-horas-tbody"></tbody>
            </table>
          </div>
          <h3>El coeficiente, renglón por renglón</h3>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th></th><th>Concepto</th><th>Incidencia %</th></tr></thead>
              <tbody id="mo-items-tbody"></tbody>
            </table>
          </div>
          <p class="nota">⚠ Las horas hábiles YA están adentro: el item
            «salarios pagados por tiempos no trabajados» es la lluvia y los
            feriados. Se multiplica por las <strong>horas efectivamente
            trabajadas</strong> — prorratear una quincena entre las horas
            trabajadas cuenta la lluvia dos veces.</p>
          <h3>Topes de la base imponible (ARCA)</h3>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th>Vigencia desde</th><th>Mínima</th><th>Máxima</th><th>Resolución</th></tr></thead>
              <tbody id="mo-topes-tbody"></tbody>
            </table>
          </div>
        </section>`;
    }

    if (v.esResumen) {
      return `
        <section class="ventana${i === 0 ? ' active' : ''}" id="ventana-${v.id}">
          <div class="controles">
            <div class="campo"><label>Desde</label><input type="date" id="resumen-desde"></div>
            <div class="campo"><label>Hasta</label><input type="date" id="resumen-hasta"></div>
            <div class="campo"><label>Monto a ajustar</label><input type="number" id="resumen-monto" placeholder="opcional" step="0.01" style="width:130px"></div>
            <div class="campo"><label>&nbsp;</label><button type="button" id="resumen-calcular">Calcular variación</button></div>
          </div>
          <div class="estado" id="estado-${v.id}"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr>
                <th>Índice</th><th>Último valor</th><th>Fecha</th>
                <th>Mes (MoM)</th><th>Año (YTD)</th><th>Interanual (YoY)</th>
                <th>YoY anualizada</th><th>5 años</th><th>Personalizado</th><th>Monto ajustado</th>
              </tr></thead>
              <tbody id="tbody-resumen"></tbody>
            </table>
          </div>
          <h3>¿Alguna serie dejó de crecer?</h3>
          <p class="nota">Pedido de Juan (13/09/2026): <em>«la vista general de
            índices debería tener todos los índices relevados y decir desde hace
            cuánto no actualiza, así vemos si hay algún problema»</em>. Hace falta
            justamente porque ahora corren solas: «corre solo» sin nadie mirando
            es como estuvieron los schedulers en agosto — todas las fuentes
            contestando bien y las series sin crecer.</p>
          <div class="estado" id="estado-frescura"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th>Serie</th><th>Valores</th><th>Último dato</th>
                <th>Días sin moverse</th><th>Cadencia</th></tr></thead>
              <tbody id="tbody-frescura"></tbody>
            </table>
          </div>
          <p class="nota">⚠ Los días se cuentan contra HOY, no contra la última
            corrida: un job que corre todos los días y trae siempre el mismo
            último dato está muerto y el historial dice «ok» igual. La tolerancia
            es por cadencia — el ICC sale una vez por mes con un mes de rezago,
            así que 44 días es lo esperable y 197 no.</p>
        </section>`;
    }

    if (v.esObra) {
      const filasCategoria = CATEGORIAS_UOCRA.map(([col, nombre]) => `
        <tr>
          <td>${nombre}</td>
          <td><input type="number" class="obra-cantidad" data-col="${col}" value="0" min="0" style="width:70px"></td>
          <td class="obra-basico" data-col="${col}">—</td>
          <td class="obra-basicok" data-col="${col}">—</td>
          <td class="obra-subneto" data-col="${col}">—</td>
          <td class="obra-subcon" data-col="${col}">—</td>
        </tr>`).join('');

      const filasApu = CATEGORIAS_UOCRA.map(([col, nombre]) => `
        <tr>
          <td>${nombre}</td>
          <td><input type="number" class="apu-cantidad" data-col="${col}" value="0" min="0" style="width:70px"></td>
          <td class="apu-horasm2" data-col="${col}">—</td>
          <td class="apu-neto" data-col="${col}">—</td>
          <td class="apu-con" data-col="${col}">—</td>
        </tr>`).join('');

      const filasHorasM2 = [35, 40, 45].map(h => `
        <tr>
          <td><input type="number" class="horasm2-horas" value="${h}" min="0" style="width:80px"></td>
          <td class="horasm2-neto">—</td>
          <td class="horasm2-con">—</td>
          <td class="horasm2-conk">—</td>
          <td class="horasm2-conkcon">—</td>
        </tr>`).join('');

      return `
        <section class="ventana${i === 0 ? ' active' : ''}" id="ventana-${v.id}">
          <h3>Cálculo de Superficie</h3>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr><th>Ambiente</th><th>m² real</th><th>%</th><th>m² efectivo</th><th></th></tr></thead>
              <tbody id="obra-superficie-tbody"></tbody>
              <tfoot>
                <tr>
                  <td colspan="3"><strong>Total (superficie de obra)</strong></td>
                  <td id="obra-superficie-total"><strong>—</strong></td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="controles">
            <div class="campo"><label>&nbsp;</label><button type="button" id="obra-superficie-agregar">+ Agregar ambiente</button></div>
          </div>

          <h3 style="margin-top:24px">Cálculo rápido de mano de obra por plazo</h3>
          <div class="controles">
            <div class="campo"><label>Meses</label><input type="number" id="obra-meses" value="1" min="0" style="width:90px"></div>
            <div class="campo"><label>Días por mes</label><input type="number" id="obra-dias" value="5" min="0" style="width:90px"></div>
            <div class="campo"><label>Horas por día</label><input type="number" id="obra-horas" value="8" min="0" style="width:90px"></div>
            <div class="campo"><label>Coef (jornal + K)</label><input type="number" id="obra-coef" value="2.15" step="0.01" style="width:90px"></div>
            <div class="campo"><label>K (ajuste $/m² adicional)</label><input type="number" id="obra-k" value="1" step="0.01" style="width:90px"></div>
            <div class="campo"><label>Superficie de obra (m²)</label><input type="number" id="obra-superficie" value="300" min="0" style="width:100px" readonly title="Calculada desde la tabla de Cálculo de Superficie, arriba"></div>
            <div class="campo"><label>&nbsp;</label><button type="button" id="obra-calcular">Calcular</button></div>
          </div>
          <div class="estado" id="estado-obra"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr>
                <th>Categoría</th><th>Cantidad</th><th>Jornal (básico)</th><th>Jornal + K</th>
                <th>Subtotal neto</th><th>Subtotal + K</th>
              </tr></thead>
              <tbody id="obra-tbody">${filasCategoria}</tbody>
              <tfoot>
                <tr>
                  <td colspan="4"><strong>Total</strong></td>
                  <td id="obra-total-neto"><strong>—</strong></td>
                  <td id="obra-total-con"><strong>—</strong></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <tbody>
                <tr><td>$/m² (neto)</td><td id="obra-m2-neto">—</td><td>$/m² (con K)</td><td id="obra-m2-con">—</td></tr>
                <tr><td>Horas totales por m²</td><td id="obra-horas-m2">—</td><td></td><td></td></tr>
                <tr><td>Variación interanual (Oficial)</td><td id="obra-oficial-yoy">—</td><td>Acumulado del año (Oficial)</td><td id="obra-oficial-ytd">—</td></tr>
              </tbody>
            </table>
          </div>

          <h3 style="margin-top:24px">Redeterminación de mano de obra</h3>
          <div class="controles">
            <div class="campo"><label>Categoría</label>${crearSelect('obra-categoria', CATEGORIAS_UOCRA.map(([col, nombre]) => ({value: col, label: nombre})), 'label', 'value')}</div>
            <div class="campo"><label>Fecha base</label><input type="date" id="obra-fecha-base"></div>
            <div class="campo"><label>Fecha nueva</label><input type="date" id="obra-fecha-nueva"></div>
            <div class="campo"><label>&nbsp;</label><button type="button" id="obra-redeterminar">Calcular Gap/TIR</button></div>
          </div>
          <div class="estado" id="estado-redeterminacion"></div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <tbody>
                <tr><td>Básico fecha base</td><td id="obra-basico-base">—</td><td>Básico fecha nueva</td><td id="obra-basico-nueva">—</td></tr>
                <tr><td>Gap</td><td id="obra-gap">—</td><td>TIR anualizada</td><td id="obra-tir">—</td></tr>
              </tbody>
            </table>
          </div>
          <div class="controles">
            <div class="campo"><label>Monto en fecha base</label><input type="number" id="obra-monto-base" placeholder="ej. 600000" style="width:140px"></div>
            <div class="campo"><label>&nbsp;</label><span id="obra-monto-redeterminado" class="estado" style="margin:0">—</span></div>
            <div class="campo"><label>Monto hoy</label><input type="number" id="obra-monto-hoy" placeholder="ej. 7082374" style="width:140px"></div>
            <div class="campo"><label>&nbsp;</label><span id="obra-valor-base" class="estado" style="margin:0">—</span></div>
          </div>

          <h3 style="margin-top:24px">Comparación con Arquímedes</h3>
          <div class="controles">
            <div class="campo"><label>Precio de Arquímedes ($)</label><input type="number" id="obra-arquimedes" placeholder="ej. 44887166" style="width:140px"></div>
            <div class="campo"><label>Precio del dólar</label><input type="number" id="obra-dolar" placeholder="ej. 1150" style="width:100px"></div>
          </div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <tbody>
                <tr><td>Precio M² Arquímedes</td><td id="obra-m2-arq">—</td><td>Precio M² Arquímedes (con K)</td><td id="obra-m2-arq-k">—</td></tr>
                <tr><td>Precio M² en USD</td><td id="obra-m2-usd">—</td><td></td><td></td></tr>
              </tbody>
            </table>
          </div>

          <h3 style="margin-top:24px">Cálculo de Mano de Obra para un Ítem (APU)</h3>
          <p class="estado" style="margin-top:0">Armá la cuadrilla del ítem (cantidad de cada categoría) y el rendimiento diario del conjunto — calcula las horas-hombre y el costo por m² (usa el mismo Coef de arriba para "con aportes").</p>
          <div class="controles">
            <div class="campo"><label>Horas por día</label><input type="number" id="apu-horas" value="8" min="0" style="width:90px"></div>
            <div class="campo"><label>Rendimiento diario (m²/día)</label><input type="number" id="apu-rendimiento" value="7" min="0" step="0.01" style="width:120px"></div>
          </div>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr>
                <th>Categoría</th><th>Cantidad en la cuadrilla</th><th>Horas/m²</th><th>Costo neto/m²</th><th>Costo con aportes/m²</th>
              </tr></thead>
              <tbody id="apu-tbody">${filasApu}</tbody>
              <tfoot>
                <tr>
                  <td colspan="2"><strong>Sumatoria</strong></td>
                  <td id="apu-total-horas"><strong>—</strong></td>
                  <td id="apu-total-neto"><strong>—</strong></td>
                  <td id="apu-total-con"><strong>—</strong></td>
                </tr>
              </tfoot>
            </table>
          </div>

          <h3 style="margin-top:24px">Estimado de mano de obra por superficie (horas de Oficial por m²)</h3>
          <p class="estado" style="margin-top:0">Regla rápida sin armar cuadrilla: cuántas horas de Oficial estimás por m² (rendimientos de referencia habituales: 35/40/45).</p>
          <div class="tabla-wrap">
            <table class="tabla-resumen">
              <thead><tr>
                <th>Horas de Oficial por m²</th><th>Neto/m²</th><th>Con aportes/m²</th><th>Con K (neto)</th><th>Con K (con aportes)</th>
              </tr></thead>
              <tbody id="horasm2-tbody">${filasHorasM2}</tbody>
            </table>
          </div>
        </section>`;
    }

    return `
      <section class="ventana${i === 0 ? ' active' : ''}" id="ventana-${v.id}">
        <div class="controles">
          ${v.esCertificados ? '' : `
          <div class="campo">
            <label>Rango</label>
            ${crearSelect(`sel-rango-${v.id}`, RANGOS, 'label', 'value')}
          </div>
          `}
          ${v.esMora ? `
            <!-- ── MORA Y DESCUENTO DE CERTIFICADOS ──────────────────────
                 Juan, 2026-09-10: «vamos a poner considerar interés simple,
                 considerar compuesto, y vemos la diferencia».

                 ⚠ Los DOS se muestran siempre, uno al lado del otro. Un
                 selector obligaría a elegir antes de ver, y la pregunta real
                 no es cuál prefiero sino cuánto hay entre uno y otro — lo que
                 está en juego cuando el contrato no lo aclara. -->
            <div class="campos">
              <div class="campo"><label>Importe del certificado</label>
                <input type="number" id="mora-monto" step="0.01" placeholder="0,00" style="width:170px"></div>
              <div class="campo"><label>Debía pagarse</label>
                <input type="date" id="mora-desde"></div>
              <div class="campo"><label>Se paga / se cobra</label>
                <input type="date" id="mora-hasta"></div>
              <div class="campo"><label>Tasa</label>
                <select id="mora-tasa" style="min-width:260px"></select></div>
              <div class="campo"><label>Qué se calcula</label>
                <select id="mora-modo">
                  <option value="mora">Mora — me pagaron tarde</option>
                  <option value="descuento">Descuento — cobrar antes</option>
                </select></div>
              <div class="campo"><label>Año de</label>
                <select id="mora-dias">
                  <option value="365">365 días</option>
                  <option value="360">360 días</option>
                </select></div>
              <div class="campo"><label>&nbsp;</label>
                <button type="button" id="mora-calcular">Calcular</button></div>
            </div>
            <div id="mora-rango" class="nota"></div>
            <div id="mora-resultado"></div>
          ` : ''}
          ${v.esCertificados ? `
            <!-- ── DESCUENTO DE CERTIFICADOS DE OBRA PÚBLICA ──────────────
                 Ley 13.064 art. 48: la tasa la fija el Banco Nación, no
                 CAMARCO. CAMARCO compila la planilla y la deja tras un login
                 de socios; acá se reconstruye con TAMAR del BCRA + el spread
                 del BNA, que son públicos los dos.

                 ⚠ CAPITALIZAR / NO CAPITALIZAR ES UN BOTÓN, NO UN CHECK
                 ESCONDIDO: es la decisión que más mueve el número después de
                 las fechas, y tiene que verse cuál está elegida sin abrir
                 nada. -->
            <div class="campos">
              <div class="campo"><label>Importe del certificado</label>
                <input type="number" id="cert-monto" step="0.01" placeholder="0,00" style="width:180px"></div>
              <div class="campo"><label>Fecha inicial</label>
                <input type="date" id="cert-desde"></div>
              <div class="campo"><label>Fecha final</label>
                <input type="date" id="cert-hasta"></div>
              <div class="campo"><label>Tomador</label>
                <select id="cert-mipyme">
                  <option value="0">No MiPyME / Grandes Inversores</option>
                  <option value="1">MiPyME</option>
                </select></div>
              <div class="campo"><label>Qué se calcula</label>
                <select id="cert-modo">
                  <option value="mora">Mora — me pagaron tarde</option>
                  <option value="descuento">Descuento — cobrar antes</option>
                </select></div>
              <!-- ⚠ ACA HABIA UN BOTON CAPITALIZAR / NO CAPITALIZAR, Y SE SACO.
                   No porque estorbara: porque elegir escondia. La lectura que
                   corresponde depende del pliego, y con un boton el que mira
                   la pantalla veia UN numero sin enterarse de que habia otro.
                   Sobre 2022-2026 los dos difieren en 300 %. Ahora salen los
                   dos, del mismo tamano, y elegir es del que lee. -->
            </div>
          ` : ''}
          ${v.esMateriales ? `
            <div class="campo">
              <label>Proveedor</label>
              <select id="sel-prov-${v.id}"></select>
            </div>
            <div class="campo">
              <label>Material(es)</label>
              <select id="sel-item-${v.id}" multiple></select>
            </div>
          ` : ''}
          ${v.esDolar ? `
            <div class="campo">
              <label>Tipo de dólar</label>
              ${crearSelect(`sel-dolartipo-${v.id}`, INDICES_AJUSTE.filter(o => o.value.startsWith('dolar_')), 'label', 'value')}
            </div>
          ` : ''}
          ${v.esConstruccion ? `
            <div class="campo">
              <label>Serie</label>
              ${crearSelect(`sel-construcciontipo-${v.id}`, CONSTRUCCION_SERIES, 'label', 'value')}
            </div>
          ` : ''}
          ${v.esSalarios ? `
            <div class="campo">
              <label>Serie</label>
              ${crearSelect(`sel-salariostipo-${v.id}`, SALARIOS_SERIES, 'label', 'value')}
            </div>
          ` : ''}
          ${v.esAlquiler ? `
            <div class="campo">
              <label>Serie</label>
              ${crearSelect(`sel-alquilertipo-${v.id}`, ALQUILER_SERIES, 'label', 'value')}
            </div>
          ` : ''}
          ${v.esFinanciamiento ? `
            <div class="campo">
              <label>Serie a graficar</label>
              ${crearSelect(`sel-fin-${v.id}`, FINANCIAMIENTO_SERIES, 'label', 'value')}
            </div>
          ` : ''}
          ${v.esRem ? `
            <div class="campo">
              <label>Serie</label>
              ${crearSelect(`sel-rem-${v.id}`, REM_SERIES, 'label', 'value')}
            </div>
          ` : (v.esFinanciamiento || v.esCertificados) ? '' : `
            <div class="campo">
              <label>Ajustar por</label>
              ${crearSelect(`sel-ajuste-${v.id}`, INDICES_AJUSTE, 'label', 'value')}
            </div>
          `}
          ${v.proyectable ? `
            <div class="campo">
              <label>&nbsp;</label>
              <label style="flex-direction:row;align-items:center;gap:6px;font-size:13px;text-transform:none;color:var(--ink)">
                <input type="checkbox" id="chk-proy-${v.id}"> Ver proyección (CER/dólar + REM)
              </label>
            </div>
          ` : ''}
        </div>
        ${v.esAlquiler ? `<p class="estado" style="color:var(--red)">Fuente discontinuada (Buenos Aires Data) — no hay datos después de agosto 2019. Sirve como referencia histórica, no para decisiones con precios de hoy.</p>` : ''}
        ${v.esFinanciamiento ? `<div id="fin-tarjetas-${v.id}"></div>` : ''}
        ${v.esCertificados ? `
          <!-- ⚠ FUERA de .controles: .controles es un flex de campos y estos
               son la salida, no un control más. Adentro, la tabla de 1.500
               filas entraba como ítem del flex y se superponía con las
               tarjetas del resultado. -->
          <div id="cert-regimenes" class="nota"></div>
          <div id="cert-tramos"></div>
          <div id="cert-resultado"></div>
          <div id="cert-tabla"></div>
        ` : ''}
        <div class="estado" id="estado-${v.id}"></div>
        ${v.esCertificados ? '' : `

const charts = {};
const PALETA = ['#E10600', '#1F6FEB', '#2EA043', '#B08800', '#8957E5', '#DA5C0C', '#0891B2', '#BE185D'];

// dibujar(id, series, puntosProy) — series: [{label, puntos: [{fecha,valor}]}]
// Une las fechas de todas las series (spanGaps para las que no coinciden
// exacto) y muestra tooltip con fecha + valor de cada serie al pasar el cursor.
function dibujar(id, series, puntosProy) {
  const ctx = document.getElementById(`chart-${id}`);
  if (charts[id]) charts[id].destroy();
  if (!series || !series.length) {
    charts[id] = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false } });
    return;
  }

  const fechas = new Set();
  series.forEach(s => s.puntos.forEach(p => fechas.add(p.fecha)));
  let labels = Array.from(fechas).sort();
  const nHist = labels.length;
  if (puntosProy && puntosProy.length) labels = [...labels, ...puntosProy.map(p => p.fecha)];

  const datasets = series.map((s, i) => {
    const mapa = new Map(s.puntos.map(p => [p.fecha, p.valor]));
    return {
      label: s.label,
      data: labels.map(f => (mapa.has(f) ? mapa.get(f) : null)),
      borderColor: PALETA[i % PALETA.length],
      backgroundColor: 'transparent',
      pointRadius: 0,
      pointHoverRadius: 4,
      pointHitRadius: 8,
      borderWidth: 2,
      tension: 0.15,
      spanGaps: true,
    };
  });

  if (puntosProy && puntosProy.length && series.length === 1) {
    const relleno = Array(Math.max(nHist - 1, 0)).fill(null);
    const ultimo = series[0].puntos.length ? [series[0].puntos[series[0].puntos.length - 1].valor] : [];
    datasets.push({
      label: 'Proyección',
      data: [...relleno, ...ultimo, ...puntosProy.map(p => p.valor)],
      borderColor: '#5A6060',
      borderDash: [6, 4],
      pointRadius: 0,
      borderWidth: 2,
      tension: 0.15,
    });
  }

  charts[id] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (item) => {
              if (item.raw === null || item.raw === undefined) return null;
              const valor = Number(item.raw).toLocaleString('es-AR', { maximumFractionDigits: 4 });
              return `${item.dataset.label}: ${valor}`;
            },
          },
        },
      },
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
    },
  });
}

// Curva mensual combinada (real + REM + repartido): puntos coloreados por
// fuente + una segunda serie con el índice acumulado (base 100) en eje derecho.
function dibujarCurvaCombinada(id, curva) {
  const ctx = document.getElementById(`chart-${id}`);
  if (charts[id]) charts[id].destroy();
  if (!curva || !curva.length) {
    charts[id] = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false } });
    return;
  }

  const labels = curva.map(c => c.periodo);
  // Cada TRAMO repartido (hasta dic-26, dic-26→jul-27, jul-27→dic-27, …) va de un
  // color distinto, para ver contra qué ancla del REM se proyectó cada mes.
  const anclas = [...new Set(curva.filter(c => c.ancla).map(c => c.ancla))].sort();
  const colorTramo = Object.fromEntries(
    anclas.map((a, i) => [a, PALETA_TRAMOS[i % PALETA_TRAMOS.length]]));
  const colores = curva.map(c =>
    (c.ancla && colorTramo[c.ancla]) || FUENTE_COLOR[c.fuente] || '#5A6060');

  // Referencia: solo las categorías que realmente aparecen en esta curva.
  const leyendaEl = document.getElementById(`leyenda-${id}`);
  if (leyendaEl) {
    const items = [];
    if (curva.some(c => c.fuente === 'real'))
      items.push([FUENTE_COLOR.real, FUENTE_LABEL.real]);
    if (curva.some(c => c.fuente === 'rem_mensual'))
      items.push([FUENTE_COLOR.rem_mensual, FUENTE_LABEL.rem_mensual]);
    anclas.forEach(a => items.push([colorTramo[a], `Repartido → ancla ${a}`]));
    items.push(['#E10600', 'Acumulado (línea, base 100)']);
    leyendaEl.innerHTML = items.map(([col, txt]) =>
      `<span style="display:inline-flex;align-items:center;gap:5px">
         <i style="width:11px;height:11px;border-radius:2px;background:${col};display:inline-block"></i>${txt}
       </span>`).join('');
  }
  let acumulado = 100;
  const acumulados = curva.map(c => { acumulado *= (1 + c.valor_pct / 100); return acumulado; });

  charts[id] = new Chart(ctx, {
    // Mixto: los mensuales en COLUMNAS (coloreadas por origen del dato) y el
    // acumulado compuesto en LÍNEA, para ver de un vistazo el aporte de cada mes
    // y cómo se va componiendo.
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'IPC mensual (%)',
          data: curva.map(c => c.valor_pct),
          backgroundColor: colores,
          borderColor: colores,
          borderWidth: 0,
          yAxisID: 'y',
          order: 2,
        },
        {
          type: 'line',
          label: 'Índice acumulado (base 100)',
          data: acumulados,
          borderColor: '#E10600',
          backgroundColor: 'transparent',
          pointRadius: 0,
          borderWidth: 2,
          tension: 0.1,
          yAxisID: 'y1',
          order: 1,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            afterLabel: (item) => {
              if (item.datasetIndex !== 0) return null;
              const c = curva[item.dataIndex];
              const base = `Fuente: ${FUENTE_LABEL[c.fuente] || ''}`;
              return c.ancla ? `${base} (ancla ${c.ancla})` : base;
            },
          },
        },
      },
      scales: {
        x: { ticks: { maxTicksLimit: 12 } },
        y: { position: 'left', title: { display: true, text: '% mensual' } },
        y1: { position: 'right', title: { display: true, text: 'Índice (base 100)' }, grid: { drawOnChartArea: false } },
      },
    },
  });
}

function fmtNum(v, dec = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return Number(v).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  const signo = v > 0 ? '+' : '';
  return `${signo}${v.toFixed(2)}%`;
}

function celdaPct(v) {
  if (v === null || v === undefined) return '<td>—</td>';
  const cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
  return `<td class="${cls}">${fmtPct(v)}</td>`;
}

// Último mapa {familia: variacion} del cálculo personalizado, para poder
// reajustar el monto al vuelo sin volver a pegarle a la API.
let resumenPersonalizados = null;

// Coeficiente de ajuste de una fila: preferimos valor_hasta/valor_desde y, si no
// vinieran, lo derivamos del % de variación.
function coefDePersonalizado(p) {
  if (!p) return null;
  const vd = Number(p.valor_desde), vh = Number(p.valor_hasta);
  if (isFinite(vd) && vd > 0 && isFinite(vh)) return vh / vd;
  const pct = Number(p.variacion_pct);
  return isFinite(pct) ? 1 + pct / 100 : null;
}

function pintarResumen(filas, personalizados) {
  if (personalizados !== undefined) resumenPersonalizados = personalizados;
  const usados = personalizados !== undefined ? personalizados : resumenPersonalizados;
  const monto = Number(document.getElementById('resumen-monto')?.value);
  const tbody = document.getElementById('tbody-resumen');
  tbody.innerHTML = filas.map(f => {
    const p = usados ? usados[f.familia] : null;
    const coef = coefDePersonalizado(p);
    const ajustado = (monto && isFinite(monto) && coef != null)
      ? (monto * coef).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : '—';
    return `<tr>
      <td>${f.nombre}</td>
      <td>${fmtNum(f.ultimo_valor, 4)}</td>
      <td>${f.ultima_fecha || '—'}</td>
      ${celdaPct(f.mom)}
      ${celdaPct(f.ytd)}
      ${celdaPct(f.yoy)}
      ${celdaPct(f.yoy_anualizada)}
      ${celdaPct(f.a5)}
      ${p ? celdaPct(p.variacion_pct) : '<td>—</td>'}
      <td>${ajustado}</td>
    </tr>`;
  }).join('');
}

async function calcularPersonalizado() {
  const desde = document.getElementById('resumen-desde').value;
  const hasta = document.getElementById('resumen-hasta').value;
  if (!desde || !hasta) return;
  const estadoEl = document.getElementById('estado-resumen');
  estadoEl.textContent = 'Calculando…';
  try {
    const resultados = await Promise.all(resumenFilas.map(async f => {
      try {
        const r = await pedir(`/api/variacion?familia=${encodeURIComponent(f.familia)}&desde=${desde}&hasta=${hasta}`);
        if (!r.ok) return [f.familia, null];
        return [f.familia, await r.json()];
      } catch { return [f.familia, null]; }
    }));
    const mapa = Object.fromEntries(resultados);
    pintarResumen(resumenFilas, mapa);
    estadoEl.textContent = `Variación personalizada: ${desde} → ${hasta}`;
  } catch (err) {
    estadoEl.textContent = 'No se pudo calcular la variación personalizada.';
    estadoEl.classList.add('error');
  }
}

let uocraBasicosVigentes = {};
let ultimoGapPct = null;

async function cargarBasicosVigentesUocra() {
  const r = await pedir(`/api/series/uocra`);
  const registros = await r.json();
  const hoy = new Date().toISOString().slice(0, 10);
  const vigentes = registros.filter(reg => reg.FECHA <= hoy).sort((a, b) => a.FECHA.localeCompare(b.FECHA));
  const basicos = {};
  if (!vigentes.length) return basicos;
  const ultimo = vigentes[vigentes.length - 1];
  CATEGORIAS_UOCRA.forEach(([col]) => { basicos[col] = Number(ultimo[col]) || 0; });
  return basicos;
}

// "Cálculo de Superficie" — lista de ambientes ponderados (Planta Baja
// 100%, Planta Alta 50%, etc., igual que Z29:AC39 del Excel de Juan) que
// suman para dar el m² total de la obra, usado en el bloque de arriba.
function filaSuperficie(nombre, m2, pct) {
  const fila = document.createElement('tr');
  fila.innerHTML = `
    <td><input type="text" class="obra-sup-nombre" value="${nombre}" style="width:140px"></td>
    <td><input type="number" class="obra-sup-m2" value="${m2}" min="0" step="0.01" style="width:90px"></td>
    <td><input type="number" class="obra-sup-pct" value="${pct}" min="0" max="100" step="1" style="width:70px"></td>
    <td class="obra-sup-efectivo">—</td>
    <td><button type="button" class="obra-sup-quitar" title="Quitar ambiente">✕</button></td>
  `;
  fila.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcularSuperficie));
  fila.querySelector('.obra-sup-quitar').addEventListener('click', () => { fila.remove(); recalcularSuperficie(); });
  return fila;
}

function renderFilasSuperficie() {
  const tbody = document.getElementById('obra-superficie-tbody');
  if (!tbody || tbody.children.length) return;
  tbody.appendChild(filaSuperficie('Planta Baja', 200, 100));
  tbody.appendChild(filaSuperficie('Planta Alta', 200, 50));
  recalcularSuperficie();
}

function recalcularSuperficie() {
  const tbody = document.getElementById('obra-superficie-tbody');
  let total = 0;
  tbody.querySelectorAll('tr').forEach(fila => {
    const m2 = Number(fila.querySelector('.obra-sup-m2').value) || 0;
    const pct = Number(fila.querySelector('.obra-sup-pct').value) || 0;
    const efectivo = m2 * (pct / 100);
    fila.querySelector('.obra-sup-efectivo').textContent = fmtNum(efectivo, 2);
    total += efectivo;
  });
  document.getElementById('obra-superficie-total').textContent = fmtNum(total, 2);
  const supEl = document.getElementById('obra-superficie');
  if (supEl) supEl.value = total.toFixed(2);
  calcularObra();
}

// "Cálculo de Mano de Obra para un Ítem" (APU) — Z63:AD74 del Excel:
// dado el rendimiento diario del CONJUNTO de la cuadrilla (m²/día) y cuántos
// de cada categoría la componen, calcula horas-hombre y costo por m².
// Reusa uocraBasicosVigentes (ya cargado para el bloque de arriba) y el
// mismo Coef ("con aportes" = básico × Coef, igual criterio que Jornal+K).
function calcularApu() {
  const horas = Number(document.getElementById('apu-horas')?.value) || 0;
  const rendimiento = Number(document.getElementById('apu-rendimiento')?.value) || 0;
  const coef = Number(document.getElementById('obra-coef')?.value) || 0;

  let totalHoras = 0, totalNeto = 0, totalCon = 0;
  document.querySelectorAll('.apu-cantidad').forEach(input => {
    const col = input.dataset.col;
    const cantidad = Number(input.value) || 0;
    const basico = uocraBasicosVigentes[col] || 0;
    const basicoCon = basico * coef;
    const horasM2 = rendimiento ? (cantidad * horas) / rendimiento : 0;
    const costoNeto = horasM2 * basico;
    const costoCon = horasM2 * basicoCon;
    totalHoras += horasM2;
    totalNeto += costoNeto;
    totalCon += costoCon;

    const hEl = document.querySelector(`.apu-horasm2[data-col="${col}"]`);
    const nEl = document.querySelector(`.apu-neto[data-col="${col}"]`);
    const cEl = document.querySelector(`.apu-con[data-col="${col}"]`);
    if (hEl) hEl.textContent = fmtNum(horasM2, 4);
    if (nEl) nEl.textContent = fmtNum(costoNeto, 2);
    if (cEl) cEl.textContent = fmtNum(costoCon, 2);
  });

  const elTh = document.getElementById('apu-total-horas');
  const elTn = document.getElementById('apu-total-neto');
  const elTc = document.getElementById('apu-total-con');
  if (elTh) elTh.innerHTML = `<strong>${fmtNum(totalHoras, 4)}</strong>`;
  if (elTn) elTn.innerHTML = `<strong>${fmtNum(totalNeto, 2)}</strong>`;
  if (elTc) elTc.innerHTML = `<strong>${fmtNum(totalCon, 2)}</strong>`;
}

// "Estimado de mano de obra por superficie" (Z76:AF82 del Excel) — tablita
// de referencia sin cuadrilla: horas de Oficial por m² (35/40/45 editables)
// × básico de Oficial (Neto y con Coef), con y sin el K de arriba.
function calcularHorasM2() {
  const basicoOficial = uocraBasicosVigentes['OFICIAL'] || 0;
  const coef = Number(document.getElementById('obra-coef')?.value) || 0;
  const k = Number(document.getElementById('obra-k')?.value) || 0;
  const basicoOficialCon = basicoOficial * coef;

  document.querySelectorAll('#horasm2-tbody tr').forEach(fila => {
    const horas = Number(fila.querySelector('.horasm2-horas').value) || 0;
    const neto = horas * basicoOficial;
    const con = horas * basicoOficialCon;
    fila.querySelector('.horasm2-neto').textContent = fmtNum(neto, 2);
    fila.querySelector('.horasm2-con').textContent = fmtNum(con, 2);
    fila.querySelector('.horasm2-conk').textContent = fmtNum(neto * k, 2);
    fila.querySelector('.horasm2-conkcon').textContent = fmtNum(con * k, 2);
  });
}

function calcularObra() {
  const coef = Number(document.getElementById('obra-coef').value) || 0;
  const k = Number(document.getElementById('obra-k').value) || 0;
  const meses = Number(document.getElementById('obra-meses').value) || 0;
  const dias = Number(document.getElementById('obra-dias').value) || 0;
  const horas = Number(document.getElementById('obra-horas').value) || 0;
  const superficie = Number(document.getElementById('obra-superficie').value) || 0;

  let totalNeto = 0, totalCon = 0, cantidadTotal = 0;
  document.querySelectorAll('.obra-cantidad').forEach(input => {
    const col = input.dataset.col;
    const cantidad = Number(input.value) || 0;
    cantidadTotal += cantidad;
    const basico = uocraBasicosVigentes[col] || 0;
    const basicoK = basico * coef;
    const subNeto = basico * cantidad * meses * dias * horas;
    const subCon = basicoK * cantidad * meses * dias * horas;
    totalNeto += subNeto;
    totalCon += subCon;

    const bEl = document.querySelector(`.obra-basico[data-col="${col}"]`);
    const bkEl = document.querySelector(`.obra-basicok[data-col="${col}"]`);
    const snEl = document.querySelector(`.obra-subneto[data-col="${col}"]`);
    const scEl = document.querySelector(`.obra-subcon[data-col="${col}"]`);
    if (bEl) bEl.textContent = fmtNum(basico, 0);
    if (bkEl) bkEl.textContent = fmtNum(basicoK, 2);
    if (snEl) snEl.textContent = fmtNum(subNeto, 0);
    if (scEl) scEl.textContent = fmtNum(subCon, 0);
  });

  document.getElementById('obra-total-neto').innerHTML = `<strong>${fmtNum(totalNeto, 0)}</strong>`;
  document.getElementById('obra-total-con').innerHTML = `<strong>${fmtNum(totalCon, 0)}</strong>`;

  const ccM2Neto = superficie ? totalNeto / superficie : 0;
  const ccM2Con = superficie ? totalCon / superficie : 0;
  document.getElementById('obra-m2-neto').textContent = fmtNum(ccM2Neto, 2);
  document.getElementById('obra-m2-con').textContent = fmtNum(ccM2Con * k, 2);
  document.getElementById('obra-horas-m2').textContent = superficie
    ? fmtNum((cantidadTotal * meses * dias * horas) / superficie, 4) : '—';

  actualizarArquimedes();
}

async function calcularRedeterminacion() {
  const estadoEl = document.getElementById('estado-redeterminacion');
  const categoria = document.getElementById('obra-categoria').value;
  const fechaBase = document.getElementById('obra-fecha-base').value;
  const fechaNueva = document.getElementById('obra-fecha-nueva').value;
  if (!fechaBase || !fechaNueva) {
    estadoEl.textContent = 'Completá fecha base y fecha nueva.';
    return;
  }
  estadoEl.textContent = 'Calculando…';
  estadoEl.classList.remove('error');
  try {
    const r = await pedir(`/api/variacion?familia=${encodeURIComponent('uocra:' + categoria)}&desde=${fechaBase}&hasta=${fechaNueva}`);
    const data = await r.json();
    if (!r.ok) {
      estadoEl.textContent = data.error || 'No hay datos para ese rango.';
      estadoEl.classList.add('error');
      return;
    }
    document.getElementById('obra-basico-base').textContent = `${fmtNum(data.valor_desde, 0)} (${data.desde})`;
    document.getElementById('obra-basico-nueva').textContent = `${fmtNum(data.valor_hasta, 0)} (${data.hasta})`;
    document.getElementById('obra-gap').textContent = fmtPct(data.variacion_pct);
    document.getElementById('obra-tir').textContent = data.tir_anualizada_pct !== null ? fmtPct(data.tir_anualizada_pct) : '—';
    estadoEl.textContent = `Calculado sobre las fechas vigentes más cercanas (${data.dias} días entre ellas)`;
    ultimoGapPct = data.variacion_pct;
    actualizarMontosRedeterminados();
  } catch (err) {
    estadoEl.textContent = `${msgFalla(err)}`;
    estadoEl.classList.add('error');
  }
}

function actualizarMontosRedeterminados() {
  const montoBase = Number(document.getElementById('obra-monto-base').value);
  const montoHoy = Number(document.getElementById('obra-monto-hoy').value);
  const spanRede = document.getElementById('obra-monto-redeterminado');
  const spanBase = document.getElementById('obra-valor-base');
  if (ultimoGapPct === null) {
    spanRede.textContent = 'Calculá el Gap primero';
    spanBase.textContent = 'Calculá el Gap primero';
    return;
  }
  const factor = 1 + ultimoGapPct / 100;
  spanRede.textContent = montoBase ? `Redeterminado a hoy: ${fmtNum(montoBase * factor, 2)}` : '—';
  spanBase.textContent = montoHoy ? `Valor a fecha base: ${fmtNum(montoHoy / factor, 2)}` : '—';
}

function actualizarArquimedes() {
  const superficie = Number(document.getElementById('obra-superficie')?.value) || 0;
  const k = Number(document.getElementById('obra-k')?.value) || 0;
  const arq = Number(document.getElementById('obra-arquimedes')?.value) || 0;
  const dolar = Number(document.getElementById('obra-dolar')?.value) || 0;
  const m2Arq = superficie ? arq / superficie : 0;
  const elArq = document.getElementById('obra-m2-arq');
  const elArqK = document.getElementById('obra-m2-arq-k');
  const elUsd = document.getElementById('obra-m2-usd');
  if (elArq) elArq.textContent = arq ? fmtNum(m2Arq, 2) : '—';
  if (elArqK) elArqK.textContent = arq ? fmtNum(m2Arq * k, 2) : '—';
  if (elUsd) elUsd.textContent = (arq && dolar) ? fmtNum(m2Arq / dolar, 4) : '—';
}

// Re-deriva familia/ajuste/item de los selectores ya presentes en la
// ventana (misma lógica que arma el gráfico) — para que la calculadora
// de "entre dos fechas" opere sobre EXACTAMENTE la serie que está mostrada.
function datosVentanaActual(v) {
  const ajuste = document.getElementById(`sel-ajuste-${v.id}`)?.value || 'ninguno';
  let familia = v.esDolar
    ? `dolar:${document.getElementById(`sel-dolartipo-${v.id}`).value}`
    : v.esConstruccion
      ? document.getElementById(`sel-construcciontipo-${v.id}`).value
      : v.esSalarios
        ? document.getElementById(`sel-salariostipo-${v.id}`).value
        : v.esAlquiler
          ? document.getElementById(`sel-alquilertipo-${v.id}`).value
          : v.familia;
  let item = null;
  if (v.esMateriales) {
    const selProv = document.getElementById(`sel-prov-${v.id}`);
    const selItem = document.getElementById(`sel-item-${v.id}`);
    const seleccionados = selItem ? Array.from(selItem.selectedOptions).map(o => o.value) : [];
    familia = 'mat:' + (selProv ? selProv.value : '');
    item = seleccionados[0] || null;
  }
  return { familia, ajuste, item };
}

// Coeficiente de ajuste por ventana (valor_hasta / valor_desde) del último cálculo.
const COEF_AJUSTE = {};

function renderMontoAjustado(v) {
  const coefEl  = document.getElementById(`calc-coef-${v.id}`);
  const montoEl = document.getElementById(`calc-monto-aj-${v.id}`);
  if (!coefEl || !montoEl) return;
  const coef = COEF_AJUSTE[v.id];
  if (coef == null) { coefEl.textContent = '—'; montoEl.textContent = '—'; return; }
  coefEl.textContent = coef.toLocaleString('es-AR', { maximumFractionDigits: 4 });
  const monto = Number(document.getElementById(`calc-monto-${v.id}`)?.value);
  montoEl.textContent = (monto && isFinite(monto))
    ? (monto * coef).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '—';
}

async function calcularVariacionVentana(v) {
  const estadoEl = document.getElementById(`calc-estado-${v.id}`);
  const { familia, ajuste, item } = datosVentanaActual(v);
  const desde = document.getElementById(`calc-desde-${v.id}`).value;
  const hasta = document.getElementById(`calc-hasta-${v.id}`).value;
  const celdas = ['calc-fecha-desde', 'calc-fecha-hasta', 'calc-valor-desde', 'calc-valor-hasta', 'calc-variacion', 'calc-tir']
    .map(id => document.getElementById(`${id}-${v.id}`));

  if (!familia || !desde || !hasta) {
    estadoEl.textContent = 'Elegí ambas fechas (y, si es Materiales, un material de la lista).';
    return;
  }

  estadoEl.textContent = 'Calculando…';
  try {
    let url = `/api/variacion?familia=${encodeURIComponent(familia)}&indice=${encodeURIComponent(ajuste)}&desde=${desde}&hasta=${hasta}`;
    if (item) url += `&item=${encodeURIComponent(item)}`;
    const r = await pedir(url);
    const data = await r.json();
    if (!r.ok) {
      estadoEl.textContent = data.error || 'Sin datos suficientes en ese rango.';
      celdas.forEach(c => c.textContent = '—');
      return;
    }
    const [cFechaDesde, cFechaHasta, cValorDesde, cValorHasta, cVariacion, cTir] = celdas;
    cFechaDesde.textContent = data.desde;
    cFechaHasta.textContent = data.hasta;
    cValorDesde.textContent = data.valor_desde;
    cValorHasta.textContent = data.valor_hasta;
    cVariacion.textContent = `${data.variacion_pct > 0 ? '+' : ''}${data.variacion_pct}%`;
    cTir.textContent = data.tir_anualizada_pct != null ? `${data.tir_anualizada_pct > 0 ? '+' : ''}${data.tir_anualizada_pct}%` : '—';
    // Coeficiente de ajuste = valor_hasta / valor_desde. Se guarda para poder
    // reajustar el monto al vuelo sin volver a pegarle a la API.
    const vd = Number(data.valor_desde), vh = Number(data.valor_hasta);
    COEF_AJUSTE[v.id] = (vd > 0 && isFinite(vd) && isFinite(vh)) ? vh / vd : null;
    renderMontoAjustado(v);
    estadoEl.textContent = `${data.dias} días entre las fechas usadas (último dato disponible en o antes de cada fecha pedida).`;
  } catch (err) {
    estadoEl.textContent = `${msgFalla(err)}`;
  }
}

// Tarjetas de tasas vigentes (Financiamiento). La FECHA de cada bloque no es
// decorativa: si el job de MAV no corre, la tarjeta mostraría un número viejo
// como si fuera de hoy. Por eso se marca en gris lo que tiene más de 7 días.
function pintarTarjetasFinanciamiento(id, data) {
  const hoy = new Date();
  const diasDesde = f => {
    if (!f) return null;
    return Math.round((hoy - new Date(f + 'T00:00:00')) / 86400000);
  };
  const fmt = v => (v === null || v === undefined) ? null : `${Number(v).toFixed(2)} %`;

  const tarjeta = (grupo, nombre, tna, dias) => {
    const vieja = dias === null || dias > 7;
    const valor = fmt(tna);
    const pie = dias === null ? 'sin dato'
      : dias === 0 ? 'de hoy'
      : dias === 1 ? 'de ayer'
      : `hace ${dias} días`;
    return `<div class="tarjeta${vieja ? ' vieja' : ''}">
      <div class="t-grupo">${grupo}</div>
      <div class="t-nombre">${nombre}</div>
      <div class="t-valor${valor ? '' : ' sindato'}">${valor || 'sin dato'}</div>
      <div class="t-pie">TNA · ${pie}</div>
    </div>`;
  };

  // Cada tasa trae SU fecha: un día puede haber operado solo un plazo, y la
  // tarjeta tiene que poder mostrar el último valor real de cada uno con su
  // antigüedad, en vez de decir "sin dato" porque hoy no operó.
  const bloques = [];
  for (const [familia, titulo] of [['cheques', 'Cheques / echeqs'], ['pagares', 'Pagarés']]) {
    const d = data[familia];
    if (!d) continue;
    const cards = (d.monedas || []).flatMap(m =>
      m.tasas.map(t => tarjeta(`${titulo} · ${m.moneda}`, t.segmento, t.tna, diasDesde(t.fecha))));
    if (cards.length) {
      bloques.push(`<div class="grupo-tarjetas">
        <h4>${titulo}</h4>
        <div class="tarjetas">${cards.join('')}</div>
      </div>`);
    }
  }
  const c = data.caucion;
  if (c) {
    bloques.push(`<div class="grupo-tarjetas">
      <h4>Caución en pesos</h4>
      <div class="tarjetas">${(c.plazos || []).map(p =>
        tarjeta('Caución', p.plazo, p.tna, diasDesde(p.fecha))).join('')}</div>
    </div>`);
  }
  if (data.bcra?.tasas?.length) {
    bloques.push(`<div class="grupo-tarjetas">
      <h4>Tasas del BCRA</h4>
      <div class="tarjetas">${data.bcra.tasas.map(t =>
        tarjeta('BCRA', t.nombre, t.tna, diasDesde(t.fecha))).join('')}</div>
    </div>`);
  }

  bloques.push(`<p class="estado">⚠ <b>Cheques en dólares no figura porque no existe en MAV</b>
    (la API responde "datos no encontrados"), no porque falte cargarlo. Los pagarés
    sí cotizan en dólares y en dólar linked.<br>
    El histórico de caución hasta el 06/08/2026 sale de las <b>cauciones propias</b>
    (la tasa que se pagó de verdad), no de la referencia de BYMA.</p>`);

  document.getElementById(`fin-tarjetas-${id}`).innerHTML = bloques.join('');
}

async function cargarVentana(v) {
  const estadoEl = document.getElementById(`estado-${v.id}`);
  estadoEl.textContent = 'Cargando…';
  estadoEl.classList.remove('error');
  const rango = document.getElementById(`sel-rango-${v.id}`)?.value || 'todo';

  if (v.esResumen) {
    try {
      const r = await pedir(`/api/resumen`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      resumenFilas = await r.json();
      pintarResumen(resumenFilas);
      estadoEl.textContent = 'Actualizado';
      // ⚠ ADENTRO de esta rama y sin await: la rama termina en `return`, asi
      // que una llamada puesta mas abajo en el dispatcher nunca se alcanzaba
      // —lo probe y la tabla quedaba vacia sin decir nada—. Sin await para que
      // un Supabase lento no retrase la tabla de variaciones, que es para lo
      // que se entra al Resumen.
      pintarFrescura();
    } catch (err) {
      estadoEl.textContent = `${msgFalla(err)}`;
      estadoEl.classList.add('error');
    }
    return;
  }

  if (v.esFinanciamiento) {
    // Dos cosas independientes: las TARJETAS con la tasa vigente de todo
    // (siempre visibles, pedido de Juan) y el GRÁFICO de la serie elegida.
    // Si una falla, la otra tiene que seguir andando.
    try {
      const r = await pedir(`/api/financiamiento`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      pintarTarjetasFinanciamiento(v.id, await r.json());
    } catch (err) {
      document.getElementById(`fin-tarjetas-${v.id}`).innerHTML =
        `<p class="estado error">${msgFalla(err)}</p>`;
    }
    try {
      const clave = document.getElementById(`sel-fin-${v.id}`).value;
      let series;
      if (BCRA_GRUPOS[clave]) {
        // Series simples: una llamada por familia, columna VALOR.
        series = (await Promise.all(BCRA_GRUPOS[clave].map(async ([familia, label]) => {
          const r = await pedir(`/api/series/${familia}`);
          if (!r.ok) return null;
          const recs = await r.json();
          return {
            label,
            puntos: recs
              .filter(x => x.VALOR !== null && x.VALOR !== undefined && x.VALOR !== '')
              .map(x => ({ fecha: x.FECHA, valor: Number(x.VALOR) }))
              .sort((a, b) => a.fecha.localeCompare(b.fecha)),
          };
        }))).filter(s => s && s.puntos.length);
      } else {
        const [familia, cols] = FINANCIAMIENTO_COLS[clave];
        const r = await pedir(`/api/series/${familia}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const recs = await r.json();
        series = cols.map(([col, label]) => ({
          label,
          puntos: recs
            .filter(x => x[col] !== null && x[col] !== undefined && x[col] !== '')
            .map(x => ({ fecha: x.FECHA, valor: Number(x[col]) }))
            .sort((a, b) => a.fecha.localeCompare(b.fecha)),
        })).filter(s => s.puntos.length);
      }
      const conDatos = series.filter(s => s.puntos.length > 1);
      dibujar(v.id, series.map(s => ({ ...s, puntos: filtrarPorRango(s.puntos, rango) })));
      const total = series.reduce((n, s) => n + s.puntos.length, 0);
      estadoEl.textContent = !total
        ? 'Todavía no hay histórico de esta serie. Se acumula un dato por día hábil mientras el server de índices esté prendido.'
        : conDatos.length
          ? `${total} datos · ${series[0].puntos[0].fecha} a ${series[0].puntos.at(-1).fecha} · TNA %`
          : `${total} dato(s) — hace falta más de uno para que el gráfico muestre algo.`;
    } catch (err) {
      estadoEl.textContent = `${msgFalla(err)}`;
      estadoEl.classList.add('error');
    }
    return;
  }

  if (v.esRedet) { await iniciarRedet(); return; }
  if (v.esManoObra) { await iniciarManoObra(); return; }
  if (v.esMora) { await iniciarMora(); return; }
  if (v.esCertificados) { await iniciarCertificados(); return; }

  if (v.esObra) {
    try {
      renderFilasSuperficie();
      uocraBasicosVigentes = await cargarBasicosVigentesUocra();
      const fechaNuevaEl = document.getElementById('obra-fecha-nueva');
      if (fechaNuevaEl && !fechaNuevaEl.value) fechaNuevaEl.value = new Date().toISOString().slice(0, 10);
      calcularObra();
      calcularApu();
      calcularHorasM2();
      cargarInteranualOficial();
      estadoEl.textContent = 'Básicos vigentes cargados. Completá cantidades/fechas y calculá.';
    } catch (err) {
      estadoEl.textContent = `${msgFalla(err)}`;
      estadoEl.classList.add('error');
    }
    return;
  }

  if (v.esRem) {
    const tipo = document.getElementById(`sel-rem-${v.id}`).value;
    const extraEl = document.getElementById(`rem-extra-${v.id}`);
    extraEl.innerHTML = '';
    try {
      if (tipo === 'ipc_anual') {
        const r = await pedir(`/api/rem/anual`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const { relevamiento, curva } = await r.json();
        if (!curva || !curva.length) {
          estadoEl.textContent = 'Sin datos todavía (correr el refresh de REM).';
          dibujar(v.id, []);
          return;
        }
        const puntos = filtrarPorRango(curva.map(c => ({ fecha: `${c.anio}-01-01`, valor: c.mediana })), rango);
        estadoEl.textContent = `Relevamiento del ${relevamiento} · inflación interanual a diciembre por año (equivale al acumulado del año calendario)`;
        dibujar(v.id, [{ label: 'REM · inflación anual (dic/dic, %)', puntos }]);
        const data = await obtenerEstimacionesRem();
        await pintarResumenAnualRem(`rem-extra-${v.id}`, data);
        return;
      }
      if (tipo === 'combinada') {
        const data = await obtenerEstimacionesRem();
        if (!data.curva || !data.curva.length) {
          estadoEl.textContent = 'Sin datos todavía (correr el refresh de REM).';
          dibujarCurvaCombinada(v.id, []);
          return;
        }
        const curvaFiltrada = filtrarPorRango(
          data.curva.map(c => ({ fecha: c.periodo, valor: c.valor_pct, fuente: c.fuente, ancla: c.ancla })), rango
        );
        const conteo = curvaFiltrada.reduce((acc, c) => { acc[c.fuente] = (acc[c.fuente] || 0) + 1; return acc; }, {});
        const partes = Object.entries(conteo).map(([f, n]) => `${n} ${FUENTE_LABEL[f] || f}`).join(' · ');
        estadoEl.textContent = `Curva mensual combinada (color de cada punto = fuente): ${partes}`;
        dibujarCurvaCombinada(v.id, curvaFiltrada.map(c => ({ periodo: c.fecha, valor_pct: c.valor, fuente: c.fuente, ancla: c.ancla })));
        await pintarResumenAnualRem(`rem-extra-${v.id}`, data);
        return;
      }
      const r = await pedir(`/api/rem/${tipo}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const { relevamiento, curva } = await r.json();
      if (!curva || curva.length === 0) {
        estadoEl.textContent = 'Sin datos todavía (correr el refresh de REM).';
        dibujar(v.id, []);
        return;
      }
      const puntos = filtrarPorRango(curva.map(c => ({ fecha: c.PERIODO, valor: c.MEDIANA })), rango);
      const nombreSerie = tipo === 'ipc' ? 'REM · inflación mensual esperada (%)' : 'REM · tipo de cambio esperado ($/USD)';
      estadoEl.textContent = `Relevamiento del ${relevamiento} · curva mensual (próximos ~${puntos.length} meses, valor al último día de cada mes)`;
      dibujar(v.id, [{ label: nombreSerie, puntos }]);
    } catch (err) {
      estadoEl.textContent = `${msgFalla(err)}`;
      estadoEl.classList.add('error');
    }
    return;
  }

  if (v.esMateriales) {
    const selProv = document.getElementById(`sel-prov-${v.id}`);
    if (!selProv.options.length) {
      selProv.innerHTML = Object.entries(proveedoresMateriales)
        .map(([id, nombre]) => `<option value="${id}">${nombre}</option>`).join('');
      selProv.addEventListener('change', async () => { await cargarItemsMateriales(v); cargarVentana(v); });
      await cargarItemsMateriales(v);
    }
  }

  const ajuste = document.getElementById(`sel-ajuste-${v.id}`)?.value;
  const sufijo = sufijoDeAjuste(ajuste);

  if (v.esMateriales) {
    const selItem = document.getElementById(`sel-item-${v.id}`);
    const seleccionados = Array.from(selItem.selectedOptions).map(o => o.value);
    if (!seleccionados.length) {
      estadoEl.textContent = 'Elegí uno o más materiales de la lista.';
      dibujar(v.id, []);
      return;
    }
    const idProv = selProv().value;
    try {
      const resultados = await Promise.all(seleccionados.map(async item => {
        const r = await pedir(`/api/ajustar?familia=${encodeURIComponent('mat:' + idProv)}&item=${encodeURIComponent(item)}&indice=${ajuste}`);
        if (!r.ok) return { label: item, puntos: [] };
        return { label: item + sufijo, puntos: filtrarPorRango(await r.json(), rango) };
      }));
      const conDatos = resultados.filter(s => s.puntos.length);
      if (!conDatos.length) {
        estadoEl.textContent = 'Sin datos para estos materiales todavía.';
        dibujar(v.id, []);
        return;
      }
      const totalPuntos = conDatos.reduce((acc, s) => acc + s.puntos.length, 0);
      estadoEl.textContent = `${conDatos.length} material(es) · ${totalPuntos} cotizaciones en total`;
      dibujar(v.id, conDatos);
    } catch (err) {
      estadoEl.textContent = `${msgFalla(err)}`;
      estadoEl.classList.add('error');
    }
    return;
  }

  const familia = v.esDolar
    ? `dolar:${document.getElementById(`sel-dolartipo-${v.id}`).value}`
    : v.esConstruccion
      ? document.getElementById(`sel-construcciontipo-${v.id}`).value
      : v.esSalarios
        ? document.getElementById(`sel-salariostipo-${v.id}`).value
        : v.esAlquiler
          ? document.getElementById(`sel-alquilertipo-${v.id}`).value
          : v.familia;

  if (!familia) {
    estadoEl.textContent = 'Sin datos disponibles todavía.';
    return;
  }

  const nombreSerieBase = v.esDolar
    ? (INDICES_AJUSTE.find(o => o.value === document.getElementById(`sel-dolartipo-${v.id}`).value)?.label.replace('÷ ', '') || 'Dólar')
    : v.esConstruccion
      ? (CONSTRUCCION_SERIES.find(o => o.value === familia)?.label || v.nombre)
      : v.esSalarios
        ? (SALARIOS_SERIES.find(o => o.value === familia)?.label || v.nombre)
        : v.esAlquiler
          ? (ALQUILER_SERIES.find(o => o.value === familia)?.label || v.nombre)
          : (v.nombreSerie || v.nombre);

  try {
    const r = await pedir(`/api/ajustar?familia=${encodeURIComponent(familia)}&indice=${ajuste}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const puntos = filtrarPorRango(await r.json(), rango);
    if (!Array.isArray(puntos) || puntos.length === 0) {
      estadoEl.textContent = 'Sin datos para esta combinación todavía.';
      dibujar(v.id, []);
      return;
    }
    let textoEstado = `${puntos.length} puntos · último: ${puntos[puntos.length - 1].fecha}`;
    let puntosProy = null;

    const chkProy = v.proyectable && document.getElementById(`chk-proy-${v.id}`);
    if (chkProy && chkProy.checked) {
      try {
        const rp = await pedir(`/api/proyectar?familia=${encodeURIComponent(v.familia)}`);
        const dataProy = await rp.json();
        if (rp.ok && dataProy.proyeccion && dataProy.proyeccion.length) {
          puntosProy = dataProy.proyeccion;
          const r2 = (dataProy.modelo.r2 * 100).toFixed(0);
          textoEstado += ` · proyección R²=${r2}% (relación histórica c/ CER y dólar, ${dataProy.modelo.n_obs} meses)`;
        } else {
          textoEstado += ` · proyección no disponible: ${dataProy.error || 'sin datos'}`;
        }
      } catch (errProy) {
        textoEstado += ' · no se pudo calcular la proyección';
      }
    }

    estadoEl.textContent = textoEstado;
    dibujar(v.id, [{ label: nombreSerieBase + sufijo, puntos }], puntosProy);
    if (v.esUocra) await pintarValoresVigentesUocra();
  } catch (err) {
    estadoEl.textContent = `${msgFalla(err)}`;
    estadoEl.classList.add('error');
  }
}

async function pintarValoresVigentesUocra() {
  const cont = document.getElementById('uocra-vigentes');
  if (!cont) return;
  cont.innerHTML = '';
  try {
    const r = await pedir(`/api/series/uocra`);
    const registros = await r.json();
    if (!registros.length) return;
    const hoy = new Date().toISOString().slice(0, 10);
    const vigentes = registros.filter(reg => reg.FECHA <= hoy).sort((a, b) => a.FECHA.localeCompare(b.FECHA));
    if (!vigentes.length) return;
    const ultimo = vigentes[vigentes.length - 1];

    const categorias = [
      ['Oficial Especializado', 'OFICIAL_ESPECIALIZADO', 'OFICIAL_ESPECIALIZADO_NO_REM'],
      ['Oficial', 'OFICIAL', 'OFICIAL_NO_REM'],
      ['Medio Oficial', 'MEDIO_OFICIAL', 'MEDIO_OFICIAL_NO_REM'],
      ['Ayudante', 'AYUDANTE', 'AYUDANTE_NO_REM'],
      ['Sereno', 'SERENO', 'SERENO_NO_REM'],
    ];
    const filas = categorias.map(([nombre, col, colNoRem]) => `
      <tr>
        <td>${nombre}</td>
        <td>${ultimo[col] ? fmtNum(ultimo[col], 0) : '—'}</td>
        <td>${ultimo[colNoRem] ? fmtNum(ultimo[colNoRem], 0) : '—'}</td>
      </tr>`).join('');

    cont.innerHTML = `
      <div class="tabla-wrap">
        <div class="estado" style="margin-top:0">Valores vigentes al ${ultimo.FECHA} (último dato con fecha ≤ hoy)</div>
        <table class="tabla-resumen">
          <thead><tr><th>Categoría</th><th>Básico</th><th>No remunerativo</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;
  } catch (err) {
    cont.innerHTML = '';
  }
}

// La sincronización inicial corre en segundo plano en el server: mostramos el
// progreso y, cuando termina de entrar la data nueva, refrescamos la vista sola.
(function vigilarSyncInicial() {
  const el = document.getElementById('estado-sync');
  let listoPrevio = null;
  const tick = async () => {
    try {
      const r = await pedir(`/api/estado-sync`);
      if (!r.ok) return;                       // backend viejo, sin el endpoint
      const s = await r.json();
      if (el) el.textContent = s.listo
        ? ''
        : `Sincronizando datos… ${s.hechas}/${s.total}${s.actual ? ` · ${s.actual}` : ''}`;
      if (listoPrevio === false && s.listo === true) {
        const activa = document.querySelector('.ventana.active');
        const v = VENTANAS.find(x => `ventana-${x.id}` === activa?.id);
        if (v) cargarVentana(v);              // entraron datos nuevos → refrescar
      }
      listoPrevio = s.listo;
      if (!s.listo) setTimeout(tick, 5000);
    } catch { /* server no disponible todavía */ }
  };
  tick();
})();

let _moraTasas = [];

// ⚠ NO BLOQUEA EL RESUMEN. Se llama sin await a proposito: si Supabase tarda,

async function pintarFrescura() {

        <td>${f.cadencia}</td></tr>`).join('');
    est.classList.toggle('error', d.atrasadas > 0);

//
// ⚠ LA REGLA DEL MES ANTERIOR NO SE APLICA ACA. El front manda los meses del
// CONTRATO y el backend busca el mes anterior en las dos puntas. Si la pantalla
// tambien la aplicara, se correria dos meses; y si la aplicara la pantalla en

let _redetSeries = [];

async function iniciarRedet() {
  const est = document.getElementById('estado-redet');
  const selSerie = document.getElementById('redet-serie');
  if (!selSerie) return;
  if (!_redetSeries.length) {
    try {
      const r = await pedir('/api/redet/series');
      _redetSeries = (await r.json()).series || [];
    } catch (e) {
      est.textContent = msgFalla(e); est.classList.add('error'); return;
    }
  }
  selSerie.innerHTML = _redetSeries.map(x =>
    `<option value="${x.serie}">${x.nombre}</option>`).join('');
  selSerie.onchange = pintarColumnasRedet;
  pintarColumnasRedet();

  document.getElementById('redet-series-tbody').innerHTML = _redetSeries.map(x => {
    // ⚠ un indice que dejo de publicarse se marca: es lo que hay que ver ANTES
    // de firmar, no cuando hay que emitir el certificado
    const viejo = x.hasta && x.hasta < new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
    return `<tr${viejo ? ' style="opacity:.6"' : ''}>
      <td>${x.nombre}</td>
      <td>${x.columnas.map(c => c.columna).filter(c => c !== '_').join(', ') || '—'}</td>
      <td>${x.hasta || '—'}${viejo ? ' ⚠ atrasado' : ''}</td></tr>`;
  }).join('');

  const hoy = new Date();
  const mes = document.getElementById('redet-mes');
  if (mes && !mes.value) mes.value = hoy.toISOString().slice(0, 7);
  document.getElementById('redet-calcular').onclick = calcularRedet;
  est.textContent = `${_redetSeries.length} índices pactables.`;
}

function pintarColumnasRedet() {
  const x = _redetSeries.find(y => y.serie === document.getElementById('redet-serie').value);
  const sel = document.getElementById('redet-columna');
  if (!x) { sel.innerHTML = ''; return; }
  sel.innerHTML = x.columnas.map(c =>
